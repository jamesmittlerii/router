[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modrouter"
version = "0.1.0"
description = "Headless mod-host and JACK pedalboard loader/router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "JACK-Client>=0.5.5",
  "mido>=1.3",
]

[project.scripts]
modrouter = "router_loader.modrouter:main"
router-calibrate-gain = "router_loader.calibrate_gain:main"
router-modhost-cmd = "router_loader.modhost_cmd:main"

[tool.setuptools.packages.find]
where = ["src"]
